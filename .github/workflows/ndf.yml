name: NDF validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install .
      - run: python tools/bootstrap_history.py
      - run: python -m unittest discover -s tests -v
      - run: python ndf.py --root examples/chrono/spec check
      - run: python ndf.py --root examples/chrono/spec test
